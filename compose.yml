name: secret-delivery
x-app-env: &app-env
  DATABASE_URL: >-
    postgresql://secret_delivery:${POSTGRES_PASSWORD:?required}@db:5432/secret_delivery
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
  SESSION_SECRET: ${SESSION_SECRET:?required}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
  REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-16777216}
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: secret_delivery
      POSTGRES_DB: secret_delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U secret_delivery -d secret_delivery']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  app:
    build:
      context: .
      target: runner
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging: *logging
  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?required}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-16777216}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
volumes:
  database:
  caddy_data:
  caddy_config:
