name: secret-delivery-test
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: secret_delivery_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d secret_delivery_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  test-data:
